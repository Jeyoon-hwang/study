name: 노션 데이터 갱신 + 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # 매시간
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 노션에서 데이터 가져오기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/fetch-notion.mjs
      - name: 기상 훈련 자동 채점 (실제 METAR 비교)
        run: node scripts/verify-wx.mjs
      - name: 채점 결과 저장
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/verify.json
          git diff --cached --quiet || (git commit -m "채점 결과 갱신" && git push)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 오늘의 출력 (지상 손 분석·METAR 해독) 만들기
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -q -r scripts/requirements.txt
          python scripts/daily_wx.py site/today.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
